# ======================================================================================================
# ExtraBan Configuration
# ======================================================================================================
# Editable settings and messages only.
# Help, errors, usage, banlist UI, system, update, and Discord are built into the plugin.
#
# Placeholders: {player} {staff} {reason} {duration} {time} {time_left} {expiry} {id} {Discord} {count}
# ======================================================================================================

config-version: "2.1.0"
# Bump this when adding new config keys (even if config-version stays the same).
config-revision: 4

# Chat prefix for normal messages (not kick screens).
prefix: "&8[&6ExtraBan&8]&r "

# ======================================================================================================
# Update Checker
# ======================================================================================================
update-checker:
  enabled: true
  check-on-startup: true
  notify-console: true
  notify-staff: true

# ======================================================================================================
# Settings
# ======================================================================================================
settings:

  # ----- Ban -----
  ban:
    default-reason: "Unfair advantage"
    broadcast: true
    tempban-max-duration: "30d"
    date-format: "yyyy-MM-dd HH:mm"
    action-bar:
      enabled: true
      countdown-time: 10

  # ----- Unban -----
  unban:
    broadcast: true

  # ----- Kick -----
  kick:
    default-reason: "Unfair advantage"
    broadcast: true
    action-bar:
      enabled: true
      countdown-time: 5

  # ----- Freeze -----
  freeze:
    broadcast: true
    countdown-time: 15

  # ----- Warn -----
  warn:
    broadcast: true
    barrier-enabled: true
    custom-model-data: 9999
    suggested-reasons:
      - "Spam"
      - "Swearing"
      - "Disrespect"
      - "Minor_offense"
      - "Chat_violation"

  # ----- Ban List -----
  banlist:
    max-display: 10

# ======================================================================================================
# Messages
# ======================================================================================================
# success   = shown to the staff member who ran the command
# broadcast = shown to the whole server (if broadcast is enabled in settings)
# kick      = disconnect screen shown to the banned/kicked player
# notify    = private chat message shown to the target player
# ======================================================================================================
messages:

  # ----- Permanent Ban -----
  ban:
    success: "&aBanned &f{player} &apermanently &8» &7{reason}"
    broadcast: "&c{player} &7was permanently banned by &c{staff} &8» &f{reason}"
    kick: |-
      &c&lYou Are Permanently Banned
      &8&m---------------------------------------------
      &7Reason &8» &f{reason}
      &7Banned by &8» &f{staff}
      &7Appeal at &8» &b{Discord}
      &8&m---------------------------------------------
    action-bar-warning: "&c&lBAN &8» &e{time}s &8» &7by &f{staff}"
    action-bar-executed: "&c&lBAN EXECUTED"
    action-bar-cancelled: "&a&lBAN CANCELLED"

  # ----- Temporary Ban -----
  tempban:
    success: "&aBanned &f{player} &afor &e{duration} &8» &7{reason}"
    broadcast: "&c{player} &7was temp-banned by &c{staff} &7for &e{duration} &8» &f{reason}"
    kick: |-
      &c&lYou Are Temporarily Banned
      &8&m---------------------------------------------
      &7Reason &8» &f{reason}
      &7Duration &8» &f{duration}
      &7Expires on &8» &f{expiry}
      &7Banned by &8» &f{staff}
      &7Appeal at &8» &b{Discord}
      &8&m---------------------------------------------

  # ----- Unban -----
  # Only needs staff confirmation + optional public announcement (no kick screen).
  unban:
    success: "&aUnbanned &f{player}&a."
    broadcast: "&a{player} &7was unbanned by &a{staff}&7."

  # ----- Kick -----
  # kick = disconnect screen shown to the kicked player (not a ban)
  kick:
    success: "&aKicked &f{player} &8» &7{reason}"
    broadcast: "&e{player} &7was kicked by &e{staff} &8» &f{reason}"
    screen: |-
      &e&lYou Have Been Kicked
      &8&m---------------------------------------------
      &7Reason &8» &f{reason}
      &7Kicked by &8» &f{staff}
      &8&m---------------------------------------------
    action-bar-warning: "&e&lKICK &8» &e{time}s &8» &7by &f{staff}"
    action-bar-executed: "&e&lKICK EXECUTED"
    action-bar-cancelled: "&a&lKICK CANCELLED"

  # ----- Freeze -----
  # {duration} = time text, or "Permanent"
  # {status}   = action-bar status text (e.g. "Left: 5 minutes" or "Permanent")
  freeze:
    success: "&aFroze &f{player} &8» &e{duration} &8» &7{reason}"
    broadcast: "&b{player} &7was frozen by &b{staff} &8» &e{duration} &8» &f{reason}"
    unfreeze-success: "&aUnfroze &f{player}&a."
    unfreeze-broadcast: "&a{player} &7was unfrozen by &a{staff}&7."
    notify: |-
      &b&lYou Have Been Frozen
      &8&m---------------------------------------------
      &7Reason &8» &f{reason}
      &7Duration &8» &f{duration}
      &7Frozen by &8» &f{staff}
      &8&m---------------------------------------------
    unfreeze-notify: "&aYou have been unfrozen."
    auto-unfreeze: "&aYour freeze has expired. You are free to move."
    action-bar-countdown: "&b&lFREEZE &8» &e{time}s"
    action-bar-frozen: "&b&lFROZEN &8» &7{status}"

  # ----- Warn -----
  warn:
    success: "&eWarned &f{player} &8» &7{reason}"
    notify: "&eYou were warned by &f{staff} &8» &7{reason}"
    broadcast: "&e{player} &7was warned by &e{staff} &8» &f{reason}"
    unwarn-success: "&aRemoved the latest warning from &f{player}&a."
    unwarn-notify: "&aYour latest warning was removed by &f{staff}&a."
    list-header: "&8&m----------&r &6Warnings &8» &f{player} &7({count}) &8&m----------"
    list-entry: "&7#{count} &8» &f{reason} &8| &7by &f{staff} &8| &7{expiry} &8| &eID {id}"
    list-footer: "&7Total warnings: &e{count}"
    list-empty: "&e{player} has no warnings on record."
